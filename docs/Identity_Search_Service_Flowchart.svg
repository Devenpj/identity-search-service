  <text class="box-title" x="1357" y="951" text-anchor="middle">Central Logger</text>
  <text class="box-sub" x="1357" y="974" text-anchor="middle">utils/logger.py</text>

  <rect class="log" x="1470" y="920" width="140" height="76"/>
  <text class="box-title" x="1540" y="951" text-anchor="middle">Outputs</text>
  <text class="box-sub" x="1540" y="974" text-anchor="middle">terminal + logs</text>

