<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <style>
      .page { fill: #f4f7fb; }
      .title { font: 800 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 600 15px Arial, sans-serif; fill: #526173; }
      .lane { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .lane-title { font: 800 18px Arial, sans-serif; fill: #0f5e73; }
      .box-title { font: 800 16px Arial, sans-serif; fill: #172033; }
      .box-sub { font: 600 12px Arial, sans-serif; fill: #667085; }
      .small { font: 700 12px Arial, sans-serif; fill: #334155; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .flow-light { stroke: #7890a8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flow-green { stroke: #087443; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .flow-red { stroke: #b42318; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .flow-pink { stroke: #be185d; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .client { fill: #e8f5f7; stroke: #0f5e73; stroke-width: 2; rx: 12; }
      .frontend { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .backend { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 12; }
      .service { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 12; }
      .data { fill: #ecfdf3; stroke: #087443; stroke-width: 2; rx: 12; }
      .asset { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 12; }
      .external { fill: #fff0ee; stroke: #b42318; stroke-width: 2; rx: 12; }
      .log { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1700" height="1200"/>

  <text class="title" x="70" y="68">Identity Search Service - Professional System Flow</text>
  <text class="subtitle" x="70" y="98">Clean client diagram showing how the dashboard, FastAPI backend, services, PostgreSQL, OCR, face matching, OSINT, news intelligence, and logging connect.</text>

  <!-- Column lanes -->
  <rect class="lane" x="55" y="135" width="250" height="225"/>
  <text class="lane-title" x="80" y="170">Client</text>

  <rect class="lane" x="345" y="135" width="285" height="660"/>
  <text class="lane-title" x="370" y="170">Frontend Dashboard</text>

  <rect class="lane" x="670" y="135" width="260" height="660"/>
  <text class="lane-title" x="695" y="170">FastAPI Layer</text>

  <rect class="lane" x="970" y="135" width="300" height="660"/>
  <text class="lane-title" x="995" y="170">Backend Services</text>

  <rect class="lane" x="1310" y="135" width="330" height="660"/>
