  <text class="box-title" x="487" y="225" text-anchor="middle">Streamlit Dashboard</text>
  <text class="box-sub" x="487" y="248" text-anchor="middle">frontend/dashboard.py</text>

  <rect class="frontend" x="375" y="315" width="225" height="92"/>
