  <path class="flow-light" d="M900 528 L950 528 L950 224 L1000 224"/>
  <path class="flow-light" d="M900 528 L950 528 L950 324 L1000 324"/>
  <path class="flow-light" d="M900 528 L950 528 L950 424 L1000 424"/>
  <path class="flow-light" d="M900 528 L950 528 L950 519 L1000 519"/>
  <path class="flow-light" d="M900 528 L950 528 L950 614 L1000 614"/>
  <path class="flow-light" d="M900 528 L950 528 L950 709 L1000 709"/>

  <!-- Document service inner dependencies, kept inside service lane -->
  <path class="flow-light" d="M1120 363 L1120 390"/>
  <path class="flow-light" d="M1120 458 L1120 485"/>
  <path class="flow-light" d="M1120 553 L1120 580"/>

  <!-- Service to DB -->
  <path class="flow-green" d="M1240 224 L1340 225"/>
  <path class="flow-green" d="M1240 224 L1290 224 L1290 330 L1340 330"/>
  <path class="flow-green" d="M1240 224 L1290 224 L1290 435 L1340 435"/>
  <path class="flow-green" d="M1240 224 L1290 224 L1290 548 L1340 548"/>
  <path class="flow-green" d="M1240 224 L1290 224 L1290 670 L1340 670"/>

